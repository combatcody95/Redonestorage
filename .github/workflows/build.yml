name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate source resources
        run: python3 tools/validate_port.py

      - name: Build
        run: ./gradlew clean build

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: redone-storage
          path: build/libs/*.jar
          if-no-files-found: error
